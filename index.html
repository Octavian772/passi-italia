<!doctype html>

<html lang="it">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Passi d'Italia – Moto Supersportive</title>

<link rel="stylesheet"

href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html,body,#map{

  height:100%;

  margin:0;

}

body{

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  background:#111;

}

#map{

  position:absolute;

  inset:0;

}

.header{

  position:absolute;

  z-index:1000;

  top:14px;

  left:14px;

  right:14px;

  background:rgba(18,18,18,.94);

  color:white;

  padding:12px 14px;

  border-radius:16px;

  box-shadow:0 4px 20px #0005;

}

.title{

  font-weight:800;

  font-size:18px;

}

.sub{

  font-size:12px;

  color:#bbb;

  margin-top:3px;

}

.legend{

  position:absolute;

  z-index:1000;

  left:14px;

  bottom:22px;

  background:rgba(18,18,18,.94);

  color:white;

  padding:10px 13px;

  border-radius:14px;

  font-size:13px;

  box-shadow:0 4px 20px #0005;

}

.row{

  display:flex;

  align-items:center;

  margin:7px 0;

  cursor:pointer;

}

.dot{

  width:13px;

  height:13px;

  border-radius:50%;

  margin-right:8px;

  border:2px solid white;

}

.status{

  font-size:10px;

  color:#aaa;

  margin-top:7px;

  max-width:260px;

}

.leaflet-popup-content-wrapper,

.leaflet-popup-tip{

  background:#171717;

  color:white;

}

.btn{

  display:inline-block;

  margin-top:8px;

  padding:7px 10px;

  background:white;

  color:#111 !important;

  text-decoration:none;

  border-radius:8px;

  font-weight:700;

}

</style>

</head>

<body>

<div id="map"></div>

<div class="header">

  <div class="title">🏍️ PASSI D'ITALIA</div>

  <div class="sub">

    Moto Supersportive • Futa · Raticosa · Giogo · Muraglione

  </div>

</div>

<div class="legend">

<div class="row" onclick="focusPass('futa')">

<span class="dot" style="background:#FFD400"></span>

Passo della Futa

</div>

<div class="row" onclick="focusPass('raticosa')">

<span class="dot" style="background:#FF7A00"></span>

Passo della Raticosa

</div>

<div class="row" onclick="focusPass('giogo')">

<span class="dot" style="background:#16C784"></span>

Passo del Giogo

</div>

<div class="row" onclick="focusPass('muraglione')">

<span class="dot" style="background:#9B5CFF"></span>

Passo del Muraglione

</div>

<div class="status" id="status">

Caricamento dei percorsi stradali…

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([44.05,11.43],10);

L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

  maxZoom:19,

  attribution:'© OpenStreetMap contributors'

}

).addTo(map);

/*

 I punti sotto servono al motore di routing

 per calcolare il percorso lungo le strade.

*/

const passes = {

futa:{

 name:"Passo della Futa",

 color:"#FFD400",

 altitude:"903 m",

 road:"SS65",

 summit:[44.0962,11.2753],

 // Covigliaio → Futa → Montecarelli

 waypoints:[

  [44.1270,11.2710],

  [44.0962,11.2753],

  [44.0410,11.2850]

 ]

},

raticosa:{

 name:"Passo della Raticosa",

 color:"#FF7A00",

 altitude:"968 m",

 road:"SS65",

 summit:[44.1510,11.3370],

 waypoints:[

  [44.0962,11.2753],

  [44.1510,11.3370],

  [44.1900,11.3900]

 ]

},

giogo:{

 name:"Passo del Giogo",

 color:"#16C784",

 altitude:"882 m",

 road:"SP503",

 summit:[44.0020,11.3880],

 waypoints:[

  [43.9910,11.3540],

  [44.0020,11.3880],

  [44.1100,11.3780]

 ]

},

muraglione:{

 name:"Passo del Muraglione",

 color:"#9B5CFF",

 altitude:"907 m",

 road:"SS67",

 summit:[43.9410,11.6560],

 waypoints:[

  [43.8640,11.6190],

  [43.9410,11.6560],

  [44.0400,11.7440]

 ]

}

};

const layers={};

/*

 Converte i punti nel formato richiesto da OSRM:

 longitudine,latitudine

*/

function waypointString(points){

 return points.map(p =>

   p[1] + "," + p[0]

 ).join(";");

}

/*

 Scarica la geometria reale del percorso stradale.

*/

async function loadRoute(id,p){

 const coords=waypointString(p.waypoints);

 const url=

 "https://router.project-osrm.org/route/v1/driving/"

 +coords+

 "?overview=full&geometries=geojson";

 try{

  const response=await fetch(url);

  if(!response.ok){

   throw new Error("Routing non disponibile");

  }

  const data=await response.json();

  if(!data.routes || !data.routes.length){

   throw new Error("Percorso non trovato");

  }

  const geometry=data.routes[0].geometry.coordinates;

  const latlngs=geometry.map(c=>[c[1],c[0]]);

  const line=L.polyline(

    latlngs,

    {

      color:p.color,

      weight:7,

      opacity:.92

    }

  ).addTo(map);

  const marker=L.circleMarker(

    p.summit,

    {

      radius:8,

      color:"#fff",

      weight:2,

      fillColor:p.color,

      fillOpacity:1

    }

  ).addTo(map);

  const maps=

   "https://www.google.com/maps/search/?api=1&query="

   +p.summit[0]+","+p.summit[1];

  const popup=

   "<b>"+p.name+"</b><br>"+

   p.altitude+" • "+p.road+

   "<br><a class='btn' target='_blank' href='"+maps+"'>"+

   "Apri navigazione</a>";

  line.bindPopup(popup);

  marker.bindPopup(popup);

  layers[id]=L.featureGroup([line,marker]);

 }

 catch(error){

  console.log(error);

 }

}

/*

 Caricamento dei quattro passi.

*/

async function loadAll(){

 const status=document.getElementById("status");

 for(const [id,p] of Object.entries(passes)){

   status.innerHTML="Caricamento: "+p.name+"…";

   await loadRoute(id,p);

 }

 status.innerHTML=

 "Tocca un passo per ingrandire il percorso.";

}

function focusPass(id){

 if(layers[id]){

   map.fitBounds(

     layers[id].getBounds(),

     {padding:[45,45]}

   );

 }

}

loadAll();

</script>

</body>

</html>
